spring:
  application:
    name: fraud-service

  datasource:
    url: jdbc:postgresql://${FRAUD_DB_HOST:localhost}:${FRAUD_DB_PORT:5435}/${FRAUD_DB_NAME:fraud_db}
    username: ${FRAUD_DB_USER:fraud_user}
    password: ${FRAUD_DB_PASSWORD:fraud_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: fraud-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.banking.*"
        spring.json.value.default.type: com.banking.fraud.service.event.TransactionCreatedEvent
        spring.json.use.type.headers: false

server:
  port: 8084

logging:
  level:
    com.banking: INFO

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://${JAEGER_HOST:localhost}:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
