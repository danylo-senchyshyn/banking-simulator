name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build common module
        run: mvn install -pl common -q --no-transfer-progress

      - name: Run unit & controller tests
        run: mvn test --no-transfer-progress
             -pl auth-service,account-service,transaction-service,fraud-service
             -Dtest="**/*Test"
             -DfailIfNoTests=false
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production

  integration-test:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build common module
        run: mvn install -pl common -q --no-transfer-progress

      - name: Run integration tests
        run: mvn test --no-transfer-progress
             -pl auth-service,account-service,transaction-service
             -Dtest="**/*IntegrationTest"
             -DfailIfNoTests=false
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production
